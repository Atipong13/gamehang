<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>วงล้อตาใคร</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d1a3a;--card:#2b2755;--ink:#fff7e6;--hot:#ff5a36;--sun:#ffc93c;--mint:#5be0b3;--dim:#8f8ab8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Mali',system-ui,sans-serif;text-align:center}
body{padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
h1{margin:8px 0}
a{color:var(--dim)}
#cur{font-size:clamp(2.2rem,9vw,3.6rem);font-weight:700;color:var(--sun);background:var(--card);border-radius:24px;padding:18px 12px;margin:8px auto 0;max-width:720px;word-break:break-word}
#cur small{display:block;font-size:1rem;color:var(--dim);font-weight:500}
#main{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:center;margin:20px auto;max-width:760px}
#wrap{position:relative;width:min(360px,92vw)}
canvas{width:100%;height:auto;display:block}
#ptr{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-size:2rem;color:var(--hot);line-height:1}
#pop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);width:68%;background:var(--ink);color:#2a1d00;border-radius:22px;padding:16px 12px;font-weight:700;font-size:1.5rem;box-shadow:0 8px 30px #0008;opacity:0;pointer-events:none;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .2s;word-break:break-word}
#pop.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto;cursor:pointer}
#pop small{display:block;font-size:.95rem;color:#6b5d99;margin-bottom:4px}
#pop b{display:block;font-size:2rem;color:var(--hot);margin-top:6px}
#snd{background:var(--card);color:var(--ink);padding:10px 16px;margin:6px}
@media (prefers-reduced-motion:reduce){#pop{transition:none}}
#side{width:min(300px,92vw);text-align:left}
#side p{color:var(--dim);margin:10px 0 4px;font-size:.95rem}
textarea{width:100%;height:110px;background:var(--card);color:var(--ink);border:0;border-radius:14px;padding:12px;font:inherit;resize:vertical}
button{font:inherit;border:0;border-radius:14px;cursor:pointer;font-weight:700}
#spin{background:var(--hot);color:#fff;font-size:1.3rem;padding:14px 30px;margin:6px}
#reset{background:var(--card);color:var(--ink);padding:10px 16px;margin:6px}
#voice{width:100%;background:var(--card);color:var(--ink);border:0;border-radius:12px;padding:10px;font:inherit;margin-bottom:6px}
#rec{background:var(--sun);color:#2a1d00;padding:10px 16px;margin:4px 0;width:100%}
#clips{color:var(--dim);font-size:.9rem;margin-top:6px}
#clips button{background:var(--card);color:var(--ink);padding:6px 10px;margin:2px}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--mint)}
</style>
</head>
<body>
<h1>🎡 วงล้อตาใคร</h1>
<div id="cur" aria-live="polite"></div>
<div id="main">
  <div>
    <div id="wrap"><div id="ptr">▼</div><canvas id="c" width="720" height="720"></canvas><div id="pop" role="status" aria-live="polite"></div></div>
  </div>
  <div id="side">
    <p>1. กรอกชื่อคนเล่น เรียงตามลำดับ (1 บรรทัด = 1 คน คนแรกเริ่มก่อน)</p>
    <textarea id="names" aria-label="ชื่อคนเล่น"></textarea>
    <p>2. กรอกข้อความในวงล้อ (1 บรรทัด = 1 ช่อง)</p>
    <textarea id="items" aria-label="ข้อความในวงล้อ"></textarea>
    <p>3. ประโยคที่ให้เสียงพูด (เรียกชื่อคนเล่น 3 ครั้งก่อน แล้วตามด้วยประโยคนี้ สุ่มไม่ซ้ำจนครบรอบ)</p>
    <textarea id="phrases" aria-label="ประโยคเสียงพูด"></textarea>
    <p>4. ทำเสียงให้เหมือนคนจริง</p>
    <select id="voice" aria-label="เลือกเสียงอ่าน"></select>
    <div id="vnote" style="color:var(--hot);font-size:.9rem"></div>
    <button id="tst" style="background:var(--card);color:var(--ink);padding:10px 16px;margin:4px 0;width:100%">🔈 ทดสอบเสียงพูด</button>
    <button id="rec">🎙️ อัดเสียงตัวเอง/เพื่อน (ใช้แทนเสียงอ่าน)</button>
    <div id="clips"></div>
  </div>
</div>
<button id="spin">หมุนวงล้อ</button><button id="reset">↺ เริ่มใหม่</button><button id="snd" aria-pressed="true">🔊 เสียง: เปิด</button>
<p><a href="/">← กลับไปเกมวงกลมระเบิด</a></p>

<script>
const $ = (id) => document.getElementById(id);
const COLORS = ['#ff5a36', '#ffc93c', '#5be0b3', '#6c8cff', '#ff8fc7', '#b78cff'];
const TAU = Math.PI * 2;
let names = ['ต้น', 'เบ๊น', 'แนน', 'ฟ้า'];
let items = ['ดื่ม 1 แก้ว', 'เต้น 10 วินาที', 'เล่าเรื่องน่าอาย', 'ร้องเพลงท่อนฮุค', 'ทำเสียงสัตว์', 'ข้ามตาไปเลย!'];
let phrases = ['ฮ่าๆๆๆ สมน้ำหน้า', 'โดนแล้วไง ฮ่าๆๆๆ', 'ขำก๊ากกก ทำไม่ได้ล่ะสิ', 'เสียใจด้วยนะจ๊ะ ล้อเล่น ฮ่าๆๆ', 'งานเข้าแล้วไง', 'เรียบร้อยโรงเรียนจีน', 'ฮ่าๆๆ สนุกแล้วสิ', 'เตรียมตัวให้ดีนะ', 'ไม่ทำไม่ได้นะจ๊ะ', 'เอาเลย เอาเลย', 'โอ้โห งานนี้เข้าเต็มๆ', 'ห้ามเบี้ยวนะเออ', 'ลุยเลย', 'ว้าย ตายแล้ว', 'สู้ๆ นะจ๊ะ'];
try {
  const s = JSON.parse(localStorage.getItem('wheel-v3'));
  if (s && s.names.length && s.items.length >= 2) { names = s.names; items = s.items; }
  const ph = JSON.parse(localStorage.getItem('wheel-ph2'));
  if (Array.isArray(ph) && ph.length) phrases = ph;
} catch {}
let turn = 0, angle = 0, busy = false, soundOn = true, actx = null;
function laugh() { // หัวเราะเยาะ: ฮ่า ฮ่า ฮ่า รัวเร็วขึ้น แล้วลากยาวสั่นๆ ท้ายสุด
  if (!soundOn || !actx) return;
  const T = actx.currentTime + 0.05;
  const burst = (t, f0, f1, len, vib) => {
    const o = actx.createOscillator(), f = actx.createBiquadFilter(), v = actx.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(f0, t); o.frequency.linearRampToValueAtTime(f1, t + len);
    if (vib) { const l = actx.createOscillator(), lg = actx.createGain(); l.frequency.value = 9; lg.gain.value = 22; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + len + 0.05); }
    f.type = 'bandpass'; f.frequency.value = 950; f.frequency.linearRampToValueAtTime(1500, t + len * 0.5); f.Q.value = 2.5;
    v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(0.55, t + 0.025); v.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(f); f.connect(v); v.connect(actx.destination); o.start(t); o.stop(t + len + 0.02);
  };
  let t = T;
  for (let i = 0; i < 8; i++) { // ฮ่า ฮ่า ฮ่า... ยิ่งหัวเราะยิ่งถี่ ยิ่งสูง
    burst(t, 300 + i * 14, 240 + i * 10, 0.12, false);
    t += 0.2 - i * 0.012;
  }
  burst(t + 0.03, 430, 260, 0.7, true); // ฮ่าาาาา ลากยาว เยาะเย้ย
}
let bag = [], lastSaid = '';
function nextPhrase() { // สุ่มแบบหยิบจากถุง ไม่ซ้ำจนกว่าจะครบทุกประโยค
  if (!bag.length) {
    bag = phrases.slice().sort(() => Math.random() - 0.5);
    if (bag.length > 1 && bag[bag.length - 1] === lastSaid) bag.unshift(bag.pop());
  }
  lastSaid = bag.pop();
  return lastSaid.replaceAll('{ชื่อ}', '').replace(/\s+/g, ' ').trim();
}
// ---- เลือกเสียงอ่านของเครื่อง (เสียง Natural/Online ของ Edge จะเหมือนคนที่สุด) ----
const hasTTS = 'speechSynthesis' in window;
let voiceName = ''; try { voiceName = localStorage.getItem('wheel-voice') || ''; } catch {}
const thVoices = () => (hasTTS ? speechSynthesis.getVoices().filter((x) => x.lang.toLowerCase().startsWith('th')) : []);
function bestVoice() {
  const L = thVoices();
  return L.find((x) => x.name === voiceName) || L.find((x) => /natural|online|neural|premium|enhanced/i.test(x.name)) || L[0];
}
function fillVoices() {
  const L = thVoices(), sel = $('voice'); sel.innerHTML = '';
  $('vnote').textContent = L.length ? '' : 'ยังไม่พบเสียงอ่านภาษาไทยในเครื่องนี้ ถ้าไม่มีเสียงพูด ให้ใช้ Edge/มือถือ หรืออัดเสียงเองแทน';
  if (!L.length) { sel.style.display = 'none'; return; }
  sel.style.display = '';
  L.forEach((v) => { const o = document.createElement('option'); o.value = v.name; o.textContent = v.name; sel.appendChild(o); });
  sel.value = bestVoice().name;
}
if (hasTTS) speechSynthesis.onvoiceschanged = fillVoices;
fillVoices();
$('voice').onchange = (e) => {
  voiceName = e.target.value; try { localStorage.setItem('wheel-voice', voiceName); } catch {}
  speak('ทดสอบ', 'เสียงนี้โอเคไหม');
};

// ---- คลิปเสียงจริง: อัดจากไมค์ (เก็บในเบราว์เซอร์) + ไฟล์ใน public/sounds ----
let db = null, clips = [], fileClips = [], clipBag = [], lastClip = null, curAudio = null;
const player = new Audio(), keepU = []; // player ใช้ตัวเดียวตลอด / keepU กันเบราว์เซอร์เก็บกวาดเสียงพูดทิ้งกลางคัน
const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
function unlock() { // มือถือ (โดยเฉพาะ iPhone) ให้พูด/เล่นเสียงได้เฉพาะที่เริ่มจากการแตะ จึงปลุกไว้ตอนกดหมุน
  try { player.src = SILENT; player.play().catch(() => {}); } catch {}
  if (hasTTS) { try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; u.lang = 'th-TH'; speechSynthesis.speak(u); } catch {} }
}
const openDB = () => new Promise((res) => {
  try {
    const r = indexedDB.open('gamehang', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('clips', { keyPath: 'id', autoIncrement: true });
    r.onsuccess = () => res(r.result); r.onerror = () => res(null);
  } catch { res(null); }
});
function loadClips() {
  clips.forEach((c) => c.id && URL.revokeObjectURL(c.url)); clips = []; clipBag = [];
  const done = () => { fileClips.forEach((u) => clips.push({ id: null, url: u })); renderClips(); };
  if (!db) return done();
  const q = db.transaction('clips').objectStore('clips').getAll();
  q.onsuccess = () => { (q.result || []).forEach((c) => clips.push({ id: c.id, url: URL.createObjectURL(c.blob) })); done(); };
  q.onerror = done;
}
function renderClips() {
  const box = $('clips'); box.innerHTML = '';
  if (!clips.length) { box.textContent = 'ยังไม่มีเสียงอัด (ตอนนี้ใช้เสียงอ่านของเครื่อง)'; return; }
  clips.forEach((c, i) => {
    const row = document.createElement('div');
    const p = document.createElement('button'); p.textContent = '▶ เสียงที่ ' + (i + 1);
    p.onclick = () => new Audio(c.url).play().catch(() => {}); row.appendChild(p);
    if (c.id) {
      const d = document.createElement('button'); d.textContent = '✕'; d.setAttribute('aria-label', 'ลบเสียงที่ ' + (i + 1));
      d.onclick = () => { const t = db.transaction('clips', 'readwrite'); t.objectStore('clips').delete(c.id); t.oncomplete = loadClips; };
      row.appendChild(d);
    }
    box.appendChild(row);
  });
}
function pickClip() { // สุ่มไม่ซ้ำจนครบรอบ
  if (!clips.length) return null;
  if (!clipBag.length) {
    clipBag = clips.slice().sort(() => Math.random() - 0.5);
    if (clipBag.length > 1 && clipBag[clipBag.length - 1] === lastClip) clipBag.unshift(clipBag.pop());
  }
  return (lastClip = clipBag.pop());
}
let rec = null;
$('rec').onclick = async () => {
  if (rec) { rec.stop(); return; }
  if (!db || !navigator.mediaDevices) { alert('เบราว์เซอร์นี้อัดเสียงไม่ได้ (ต้องเปิดผ่าน localhost หรือ https)'); return; }
  try {
    const st = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mr = new MediaRecorder(st), parts = []; rec = mr;
    const tm = setTimeout(() => mr.state === 'recording' && mr.stop(), 8000); // อัดได้ครั้งละไม่เกิน 8 วินาที
    mr.ondataavailable = (e) => parts.push(e.data);
    mr.onstop = () => {
      clearTimeout(tm); st.getTracks().forEach((t) => t.stop()); rec = null;
      $('rec').textContent = '🎙️ อัดเสียงตัวเอง/เพื่อน (ใช้แทนเสียงอ่าน)';
      const t = db.transaction('clips', 'readwrite'); t.objectStore('clips').add({ blob: new Blob(parts, { type: mr.mimeType }) }); t.oncomplete = loadClips;
    };
    mr.start(); $('rec').textContent = '⏹ กดหยุดเมื่อพูดจบ';
  } catch { alert('เปิดไมค์ไม่ได้ ต้องกดอนุญาตการใช้ไมค์ในเบราว์เซอร์ก่อน'); }
};

let speakId = 0;
function speak(who, text) { // เรียกชื่อ 3 ครั้ง แล้วตามด้วยเสียงอัดจริง (ถ้ามี) หรือประโยคจากเสียงอ่าน
  if (!soundOn) return;
  const id = ++speakId;
  if (curAudio) curAudio.pause();
  if (hasTTS) speechSynthesis.cancel();
  const v = hasTTS ? bestVoice() : null;
  const seq = [[who, 1.4, 1.3], [who, 1.6, 1.3], [who, 1.8, 1.25], [text, 1.5, 0.95]];
  const run = function (i) {
    if (id !== speakId) return;
    if (i === 3) {
      const c = pickClip();
      if (c) { curAudio = player; player.src = c.url; player.play().catch(() => {}); return; }
    }
    if (i >= seq.length || !hasTTS) return;
    const u = new SpeechSynthesisUtterance(seq[i][0]);
    u.lang = 'th-TH'; u.pitch = seq[i][1]; u.rate = seq[i][2]; if (v) u.voice = v;
    u.onend = () => setTimeout(() => run(i + 1), i < 2 ? 0 : 350);
    u.onerror = () => {};
    keepU.push(u); speechSynthesis.speak(u);
  };
  keepU.length = 0;
  setTimeout(() => run(0), 150); // Chrome มักทิ้งเสียงที่สั่งพูดทันทีหลัง cancel()
}
$('snd').onclick = () => { soundOn = !soundOn; if (!soundOn) { speakId++; if (curAudio) curAudio.pause(); if (hasTTS) speechSynthesis.cancel(); } $('snd').textContent = '🔊 เสียง: ' + (soundOn ? 'เปิด' : 'ปิด'); $('snd').setAttribute('aria-pressed', soundOn); };
$('pop').onclick = () => $('pop').classList.remove('on');
$('tst').onclick = () => { unlock(); speak(names[0] || 'ทดสอบ', 'ได้ยินเสียงนี้ไหม'); };
const g = $('c').getContext('2d');
const save = () => { try { localStorage.setItem('wheel-v3', JSON.stringify({ names, items })); localStorage.setItem('wheel-ph2', JSON.stringify(phrases)); } catch {} };

function draw() {
  const n = items.length, arc = TAU / n, R = 350;
  g.clearRect(0, 0, 720, 720);
  g.save(); g.translate(360, 360);
  items.forEach((t, i) => {
    const a0 = angle + i * arc;
    g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, R, a0, a0 + arc); g.closePath();
    g.fillStyle = COLORS[i % COLORS.length]; g.fill();
    g.strokeStyle = '#1d1a3a'; g.lineWidth = 4; g.stroke();
    g.save(); g.rotate(a0 + arc / 2); g.textAlign = 'right'; g.fillStyle = '#2a1d00';
    g.font = '700 ' + (n > 10 ? 26 : 32) + 'px Mali, sans-serif';
    g.fillText(t.length > 13 ? t.slice(0, 12) + '…' : t, R - 28, 11);
    g.restore();
  });
  g.beginPath(); g.arc(0, 0, 36, 0, 7); g.fillStyle = '#1d1a3a'; g.fill();
  g.restore();
}

function showTurn() {
  $('cur').innerHTML = '<small>ตาของ</small>';
  $('cur').append(names[turn]);
}

const lines = (v) => v.split('\n').map((s) => s.trim()).filter(Boolean);
$('names').value = names.join('\n');
$('items').value = items.join('\n');
$('phrases').value = phrases.join('\n');
$('phrases').oninput = (e) => { const L = lines(e.target.value); if (L.length) { phrases = L; bag = []; save(); } };
$('names').oninput = (e) => {
  const L = lines(e.target.value);
  if (!L.length) return;
  names = L; save(); if (turn >= names.length) turn = 0; showTurn();
};
$('items').oninput = (e) => {
  const L = lines(e.target.value);
  if (L.length < 2 || busy) return;
  items = L; save(); draw();
};

$('spin').onclick = () => {
  if (busy) return;
  busy = true; $('spin').disabled = true; $('pop').classList.remove('on');
  unlock();
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch {}
  const start = angle, total = TAU * (5 + Math.random() * 3) + Math.random() * TAU;
  const dur = 4200, t0 = performance.now();
  (function step(now) {
    const k = Math.min((now - t0) / dur, 1);
    angle = start + total * (1 - Math.pow(1 - k, 3));
    draw();
    if (k < 1) return requestAnimationFrame(step);
    const arc = TAU / items.length;
    const a = (((-Math.PI / 2 - angle) % TAU) + TAU) % TAU;
    $('pop').innerHTML = '<small></small><b></b>';
    $('pop').firstChild.textContent = names[turn] + ' ต้อง';
    $('pop').lastChild.textContent = items[Math.floor(a / arc)];
    $('pop').classList.add('on'); laugh();
    { const who = names[turn], line = nextPhrase(); setTimeout(() => speak(who, line), 1100); }
    turn = (turn + 1) % names.length; showTurn(); // ข้ามไปคนถัดไปอัตโนมัติ
    busy = false; $('spin').disabled = false;
  })(t0);
};

$('reset').onclick = () => { if (busy) return; turn = 0; $('pop').classList.remove('on'); showTurn(); };

draw(); showTurn();
openDB().then((d) => { db = d; return fetch('sounds/list.json').then((r) => (r.ok ? r.json() : [])).catch(() => []); })
  .then((a) => { (Array.isArray(a) ? a : []).forEach((f) => fileClips.push('sounds/' + f)); loadClips(); });
</script>
</body>
</html>
